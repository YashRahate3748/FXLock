server:
  port: 8081

spring:
  application:
    name: rate-service

  datasource:
    url: ${FXLOCK_DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
    username: ${FXLOCK_DB_USERNAME:FXLOCK}
    password: ${FXLOCK_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

fxlock:
  twelve-data:
    base-url: https://api.twelvedata.com
    api-key: ${TWELVE_DATA_API_KEY}
    symbol: EUR/USD
    connect-timeout: 3s
    read-timeout: 5s
    rate-limit-backoff: 60s

  rate:
    scheduler-delay-ms: 15000
    max-provider-clock-skew-seconds: 30

security:
  service:
    username: ${FXLOCK_SERVICE_USERNAME:fxlock-service}
    password: ${FXLOCK_SERVICE_PASSWORD}

  risk:
    username: ${FXLOCK_RISK_USERNAME:risk-analyst}
    password: ${FXLOCK_RISK_PASSWORD}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.ofss.fxlock.rate: INFO