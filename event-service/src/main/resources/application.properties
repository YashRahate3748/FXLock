server.port=8084
server.address=${SERVICE_BIND_ADDRESS:127.0.0.1}
spring.application.name=event-service
spring.datasource.url=${ORACLE_JDBC_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${ORACLE_USERNAME:FXLOCK}
spring.datasource.password=${ORACLE_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.sql.init.mode=never
spring.security.user.name=${M4_OPS_USERNAME:fxlock-ops}
spring.security.user.password=${M4_OPS_PASSWORD}
spring.security.user.roles=OPS
eureka.client.enabled=${EUREKA_ENABLED:true}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${SERVICE_IP:127.0.0.1}
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.ip-address}:${server.port}
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=false
spring.kafka.producer.properties.max.in.flight.requests.per.connection=1
spring.kafka.producer.properties.max.block.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.delivery.timeout.ms=10000
spring.kafka.consumer.group-id=fxlock-audit-v1
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.max-poll-records=20
spring.kafka.consumer.properties.allow.auto.create.topics=false
spring.kafka.listener.ack-mode=record
spring.kafka.listener.missing-topics-fatal=false
spring.kafka.admin.auto-create=false
fxlock.events.poll-ms=2000
fxlock.events.retry-seconds=10
fxlock.events.batch-size=20
fxlock.events.topics=fx-rate-updated,fx-settlement-completed,fx-system-alert,fx-quote-events,fx-simulated-funding-completed
management.endpoints.web.exposure.include=health,info
