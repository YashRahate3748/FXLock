spring.application.name=settlement-service

server.port=8083

spring.datasource.url=${FXLOCK_DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${FXLOCK_DB_USERNAME:FXLOCK}
spring.datasource.password=${FXLOCK_DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.sql.init.mode=never

eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${SERVICE_IP:127.0.0.1}
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.ip-address}:${server.port}