spring.application.name=settlement-service
server.port=8083

spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/FREEPDB1
spring.datasource.username=fxlock
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

spring.sql.init.mode=never

eureka.client.enabled=${EUREKA_ENABLED:false}
eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}

eureka.instance.prefer-ip-address=true
eureka.instance.ip-address=${SERVICE_IP:127.0.0.1}
eureka.instance.instance-id=${spring.application.name}:${eureka.instance.ip-address}:${server.port}

fxlock.internal-token=${FX_INTERNAL_TOKEN:}
server.servlet.session.cookie.name=FXLOCK_M3_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
fxlock.dashboard.quote-url=${FXLOCK_QUOTE_BROWSER_URL:http://localhost:8082}
fxlock.funding.max-amount=${FXLOCK_FUNDING_MAX_AMOUNT:1000000.00}
fxlock.funding.password-attempts=${FXLOCK_FUNDING_PASSWORD_ATTEMPTS:5}
fxlock.funding.password-window-seconds=${FXLOCK_FUNDING_PASSWORD_WINDOW_SECONDS:60}
