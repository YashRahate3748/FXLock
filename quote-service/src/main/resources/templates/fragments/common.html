<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"><body>
<!-- All MVC screens hosted here can reuse these fragments. Remote service screens require agreed links/routes. -->
<header th:fragment="header"><a href="/" class="brand">FXLock</a>
<nav aria-label="Main navigation"><a href="/">Convert</a><a href="/transactions" th:attr="aria-current=${historyPage == true ? 'page' : null}">Transaction history</a></nav>
<span>Signed in · <span th:text="${customer}"></span></span>
<form th:action="@{/logout}" method="post"><button class="quiet">Sign out</button></form></header>
<footer th:fragment="footer">Customer quotes and transaction history are provided by M2. Rate health and operational screens can share this layout.</footer>
</body></html>
